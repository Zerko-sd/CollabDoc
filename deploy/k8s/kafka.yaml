# Single-broker Kafka (KRaft, no ZooKeeper) carrying events between app pods.
# Its storage is an emptyDir on purpose: every event is already in the
# operation log in PostgreSQL, and consumers start from "latest", so a broker
# restart loses nothing anyone would replay.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: collabdoc
spec:
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: collabdoc
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      # Otherwise Kubernetes injects KAFKA_PORT=tcp://... for the "kafka"
      # Service, and the image reads every KAFKA_* variable as broker config.
      enableServiceLinks: false
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          ports:
            - { containerPort: 9092, name: broker }
          env:
            - { name: CLUSTER_ID, value: "4L6g3nShT-eMCtK--X86sw" }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "1" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms384m -Xmx384m" }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 640Mi }
            limits: { memory: 900Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
      volumes:
        - name: data
          emptyDir: {}
