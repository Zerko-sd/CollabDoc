# The FastAPI server. A StatefulSet rather than a Deployment for two reasons:
#
#  * stable names (app-0, app-1, ...) that the router hashes documents onto,
#    so a document keeps its pod across restarts of the other pods;
#  * ordered start-up, so only one pod at a time runs the schema migrations
#    in init_db() against the shared database.
#
# __IMAGE__, __BUCKET__, __REGION__ and __REPLICAS__ are filled in by deploy.ps1.
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: collabdoc
spec:
  clusterIP: None # headless: gives each pod its own DNS name
  selector: { app: collabdoc }
  ports:
    - { name: http, port: 8000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app
  namespace: collabdoc
spec:
  serviceName: app
  replicas: __REPLICAS__
  podManagementPolicy: OrderedReady
  selector:
    matchLabels: { app: collabdoc }
  template:
    metadata:
      labels: { app: collabdoc }
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ecr-pull
      # Shutdown drains every open room's operation queue to the database.
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.37.0
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: app
          image: __IMAGE__
          ports:
            - { containerPort: 8000, name: http }
          env:
            - { name: COLLABDOC_BROADCASTER, value: "kafka:kafka:9092" }
            - { name: COLLABDOC_UPLOAD_BUCKET, value: "__BUCKET__" }
            - { name: AWS_DEFAULT_REGION, value: "__REGION__" }
          envFrom:
            - secretRef: { name: collabdoc } # COLLABDOC_SECRET_KEY, COLLABDOC_DATABASE_URL
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
